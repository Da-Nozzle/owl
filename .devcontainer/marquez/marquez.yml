server:
  applicationConnectors:
    - type: http
      port: 5000
      httpCompliance: RFC7230_LEGACY
  adminConnectors:
    - type: http
      port: 5001

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}

migrateOnStartup: true

graphql:
  enabled: true

search:
  enabled: false
  scheme: http
  host: opensearch
  port: 9200
  username: admin
  password: admin

logging:
  level: INFO
  appenders:
    - type: console
