storage:
  postgres:
    postgres_db:
      # SQLAlchemy 2.1 defaults to psycopg 3; dagster-postgres only installs psycopg2.
      scheme: postgresql+psycopg2
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# Each lake writer's pool is named after what it writes: one run per pool at a time, so two runs
# never write the same tables, while different pools run in parallel.
concurrency:
  pools:
    default_limit: 1

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# A run that died with its code server stays STARTED, holding its pool's slot, and the
# DefaultRunLauncher cannot tell its process is gone, so the daemon fails any run past
# max_runtime_seconds. Runs take minutes; a longer one sets the tag dagster/max_runtime (seconds).
run_monitoring:
  enabled: true
  max_runtime_seconds: 3600
  free_slots_after_run_end_seconds: 60

telemetry:
  enabled: false
