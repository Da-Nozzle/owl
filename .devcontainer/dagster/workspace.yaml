# One code location per lake: the module sets the mode, and each location's process holds its
# lake's dbt variables. Production deploys live only.
load_from:
  - python_module:
      module_name: leads_dagster_orchestration.entrypoints.live
      location_name: live
  - python_module:
      module_name: leads_dagster_orchestration.entrypoints.replay
      location_name: replay
