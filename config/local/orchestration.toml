# Read by the dev tools only (leads-dagster-dev, leads-mcp-dagster). In production the webserver is
# deployed on its own.
[dagster]
# The code locations, live and replay, side by side. Production deploys live only.
workspace = "/workspace/.devcontainer/dagster/workspace.yaml"

[dagster.webserver]
host = "0.0.0.0"
port = 3000

[transform]
project_dir = "/workspace/services/transform"
# DuckDB's memory_limit in each dbt process, beyond which it spills to target/ or fails. Unset,
# each takes up to 80% of RAM, and several run at once (one per source and lake).
duckdb_memory_limit = "2GB"
# Models each dbt process builds at once, all within its duckdb_memory_limit.
dbt_threads = 4

[archive_index]
# Seconds between the sensor's looks for complete snapshots in the archive.
sensor_interval_seconds = 60
