[postgres]
host = "postgres"
port = 5432
user = "owl"
password = "owl" # local only; also in .devcontainer/compose.yml
# Production example:
# host = "owl.abc123.eu-central-1.rds.amazonaws.com"
# password = { secret_name = "owl/postgres-password" }
# TODO on RDS, use IAM auth tokens instead of a password. A token expires after 15 minutes, while
# Configuration caches each resolved secret and dbt is handed the password once.

# Created by .devcontainer/postgres/initdb locally; by infrastructure code in production.
[postgres.databases]
dagster = "dagster"
ducklake_catalog = "ducklake_catalog"
marquez = "marquez"
app = "app"

[lake]
data_path = "s3://owl-lake/"
# data_path = "s3://owl-lake-prod/" # production
# Raw source downloads, kept so any month can be reloaded without calling the sources again.
archive_path = "s3://owl-lake/archive/"
# Postgres schema in ducklake_catalog that holds the lake's metadata.
metadata_schema = "ducklake"
# TODO give the archive and lake.replay's data_path versioned buckets of their own (e.g.
# s3://owl-archive/): under data_path, DuckLake's orphan-file cleanup could delete them. Needs a
# data migration, and locally s3mock's buckets created with PutBucketVersioning. A rerun then
# overwrites the current object and S3 keeps the old one as a version, so the archive needs no
# write-once logic. A file's .meta.json sidecar is a separate object whose versions are not tied
# to the file's: store fetched_at and Last-Modified as S3 object metadata instead (the local
# replay sample would still need sidecars), or record VersionIds at fetch time.

# Replay builds into a lake of its own, so the sample's rows never share a table with live ones:
# the same Postgres database and bucket, a schema and prefix apart.
[lake.replay]
metadata_schema = "ducklake_replay"
data_path = "s3://owl-lake/replay/"

[lake.s3]
endpoint = "s3mock:9090"
region = "eu-central-1"
url_style = "path"
use_ssl = false
key_id = "s3mock"
secret = "s3mock"
# Production example (AWS S3). Keys, not an instance role: a role needs the dbt profile's
# credential_chain provider, which the OWL_S3_* variables cannot express yet.
# endpoint = "s3.eu-central-1.amazonaws.com"
# url_style = "vhost"
# use_ssl = true
# key_id = { secret_name = "owl/lake-s3-key-id" }
# secret = { secret_name = "owl/lake-s3-secret" }
