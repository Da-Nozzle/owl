[postgres]
host = "postgres"
port = 5432
user = "leads"
password = "leads" # local only; also set in .devcontainer/compose.yml
# Production example:
# host = "leads.abc123.eu-central-1.rds.amazonaws.com"
# password = { secret_store = "prod", secret_name = "leads/postgres-password" }

# Created by .devcontainer/postgres/initdb locally; by infrastructure code in production.
[postgres.databases]
dagster = "dagster"
ducklake_catalog = "ducklake_catalog"
marquez = "marquez"
app = "app"

[lake]
data_path = "s3://leads-lake/"
# Raw source downloads, kept so any month can be reloaded without calling the sources again.
# TODO move to its own bucket with versioning enabled (e.g. s3://leads-archive/), outside
# data_path, where DuckLake's orphan-file cleanup could delete it. Locally s3mock needs the
# bucket created and PutBucketVersioning called; in production it is infrastructure code.
archive_path = "s3://leads-lake/archive/"
# Postgres schema in ducklake_catalog that holds the lake's metadata.
# dlt and dbt MUST use the same schema
metadata_schema = "ducklake"
# data_path = "s3://leads-lake-prod/" # production

# Replay runs (pipeline.mode = "replay") build into a lake of their own, so the sample's rows
# never share a table with live ones. Same Postgres database and bucket; a schema and prefix apart.
# TODO like the archive, the prefix sits inside the live data_path, where DuckLake's orphan-file
# cleanup could delete it: give each its own bucket.
[lake.replay]
metadata_schema = "ducklake_replay"
data_path = "s3://leads-lake/replay/"

[lake.s3]
endpoint = "s3mock:9090"
region = "eu-central-1"
url_style = "path"
use_ssl = false
key_id = "s3mock"
secret = "s3mock"
# Production example (AWS S3). An instance role instead of keys would need the dbt profile's
# credential_chain provider, which the LEADS_S3_* variables cannot express yet.
# endpoint = "s3.eu-central-1.amazonaws.com"
# url_style = "vhost"
# use_ssl = true
# key_id = { secret_store = "prod", secret_name = "leads/lake-s3-key-id" }
# secret = { secret_store = "prod", secret_name = "leads/lake-s3-secret" }
