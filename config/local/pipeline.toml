# Each source's <source>.http table configures its HTTP client:
#   timeout_seconds: how long the server may send nothing, to connect or between two reads
#   attempts: tries in all, for a timeout, a dropped connection, a 5xx or a 429
#   backoff_seconds: the wait before the first retry, doubled at each, unless Retry-After asks
#   max_wait_seconds: the longest wait before a retry, either way
#   min_interval_seconds: the least time between the starts of two of its requests (0 for none)
[pipeline]
# The timezone of every source's snapshot_schedule (cron).
timezone = "Europe/Vilnius"
user_agent = "owl-pipeline/0.1"
# The committed sample the replay code location reads instead of calling the sources.
replay_path = "/workspace/replay"

[google_places]
# Google's Places API (New). A sweep is planned with place ids only, which is free, then pays for
# the fields the leads need (ratings, review counts, opening hours, websites, phones).
api_key = { secret_name = "google_places_api_key" }
search_text_url = "https://places.googleapis.com/v1/places:searchText"
# Monthly on the 21st with Sodra, so each month's leads compare Google's month with Sodra's.
snapshot_schedule = "0 6 21 * *"
# Each is searched over every search area (the google_search_scope seed). English as well, as it
# finds places Lithuanian does not; a place several queries find is paid for once.
queries = [
    "kavinė",
    "restoranas",
    "cafe",
    "restaurant",
    "kirpykla",
    "grožio salonas",
    "hair salon",
    "beauty salon",
    "autoservisas",
    "car repair",
]
language_code = "lt"
region_code = "LT"
# A tile with places wider than this is split into quarters: over a larger tile a search finds
# only some of the places, even below its cap of 60.
max_tile_meters = 1000
# A tile whose search is capped is split into quarters while they are at least this wide.
min_tile_meters = 100
# The fetch fails before paying for anything if its plan needs more paid requests than this.
max_paid_requests = 1500
# Searches in flight at once. Google's quota is per minute and per project; requests over it are
# retried (google_places.http), so more workers than it allows only means more waiting.
workers = 16
# The fetch's dagster/max_runtime: at the per-minute quota its free plan alone may take hours.
fetch_max_runtime_seconds = 10800
# Text Search Enterprise pricing, for the plan's estimate: the requests free each month on the
# billing account, then USD per request (USD 35 per 1,000).
free_paid_requests_a_month = 1000
usd_per_paid_request = 0.035

[google_places.http]
# A sweep sends past the per-minute quota on purpose, so a 429 is retried for about five minutes:
# after 2, 4, 8, 16 and 32 s, then every minute.
timeout_seconds = 30
attempts = 10
backoff_seconds = 2
max_wait_seconds = 60
min_interval_seconds = 0

[sodra]
download_url_template = "https://atvira.sodra.lt/imones/downloads/{year}/monthly-{year}.csv.zip"
# Sodra publishes the previous month by the 20th. A fetch by hand before the 21st replaces the
# previous month's snapshot.
snapshot_schedule = "0 6 21 * *"
# Months loaded per snapshot, up to the month before it. Each snapshot reloads them all, so
# Sodra's revisions land; 13 gives a year-on-year comparison.
history_months = 13

[sodra.http]
# Whole files, which a server may take a while to produce. Five attempts in about 15 s ride out a
# proxy's hiccup, yet fail the run when a server is down.
timeout_seconds = 300
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 0

[jar]
# {dataset} is a dataset's path below rc/jar/, such as iregistruoti/JuridinisAsmuo.
download_url_template = "https://get.data.gov.lt/datasets/gov/rc/jar/{dataset}/:format/csv"
# Updated at most monthly, on no fixed day; on the 21st with Sodra, so each month's leads see the
# newest register.
snapshot_schedule = "0 6 21 * *"

[jar.http]
# Whole exports, as sodra.http.
timeout_seconds = 300
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 0

[jar_financial_statements]
# {dataset} is a dataset's path below rc/jar/, such as pelno_ataskaitos/PelnoAtaskaita.
download_url_template = "https://get.data.gov.lt/datasets/gov/rc/jar/{dataset}/:format/csv"
# Loaded in JAR's batches every three to six months (2025-05, 2025-09, 2026-03), each export the
# whole history, about 7 GB: quarterly on the 21st, with JAR's fetch of the month.
snapshot_schedule = "0 6 21 3,6,9,12 *"
# The portal drops a response after about 25 minutes and sends a page of rows at 0.6 to 1.6 MB/s:
# 500,000 rows are about 220 MB, two to seven minutes: 35 pages and 4 counts in all.
page_rows = 500000
# The fetch's dagster/max_runtime: 7 GB at the slowest 0.6 MB/s seen take over three hours.
fetch_max_runtime_seconds = 14400

[jar_financial_statements.http]
# Pages fetched whole, as sodra.http's files; one silent for 300 s midway is asked for again.
timeout_seconds = 300
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 1

[address_register]
# {dataset} is a dataset's path below rc/ar/, such as pastatas/Pastatas.
download_url_template = "https://get.data.gov.lt/datasets/gov/rc/ar/{dataset}/:format/csv"
# Loaded in the same batches as JAR, on no fixed day, so fetched with it: a JAR seat resolves in
# the same month's snapshot.
snapshot_schedule = "0 6 21 * *"

[address_register.http]
# Whole exports, as sodra.http.
timeout_seconds = 300
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 0

[vmi]
# The taxpayer register's Spinta model, and the EVRK 2 classifier its activities refer to.
register_url = "https://get.data.gov.lt/datasets/gov/vmi/mm_registras/MokesciuMoketojas"
activities_url = "https://get.data.gov.lt/datasets/gov/lsd/cl/evrk/EkonominesVeiklosRusis"
# The register changes most days, mostly at about 00:00 UTC. A snapshot holds the changes made in
# the day before its tick.
daily_changes_schedule = "0 6 * * *"
# The first day partitioned. The changelog reaches back to 2024-02-07, so any day since can be
# fetched, again or late.
first_daily_changes = "2026-09-01"
# The whole register (350 MB), the baseline the daily changes after it apply to.
monthly_register_schedule = "0 6 21 * *"
# Changes per changelog request: about 3 MB of JSON, well within what DuckDB reads as one object.
changelog_page_size = 10000
# The portal caches an export for up to a minute (max-age=60), so an export behind the changelog
# is asked for again after this wait, up to register_export_attempts times in all.
register_export_attempts = 5
register_export_wait_seconds = 65

[vmi.daily_changes_http]
# Many small changelog reads, each answered in under a second, so one silent for 30 s has hung.
# The portal stops answering changelog reads for a while after a burst, hence one a second.
timeout_seconds = 30
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 1

[vmi.monthly_register_http]
# Whole exports, as sodra.http.
timeout_seconds = 300
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 0

[vmi_tax_arrears]
# VMI's list of companies with tax arrears (Juridinių asmenų nepriemokos sumos), one row per
# company, reloaded every morning at about 06:00 UTC. Fetched through its changelog, which holds
# every change since the list's first load on 2024-11-18.
model_url = "https://get.data.gov.lt/datasets/gov/vmi/ja_nepriemokos/NepriemokosSuma"
# Monthly on the 21st with Sodra and JAR: a snapshot holds the month's changes up to its tick, so
# each month's leads see the list as it stood that morning. Daily would work as well: the list
# changes most mornings and the changelog keeps every change, so a daily cadence (about 700
# partitions back to 2024-11) costs requests, not data.
snapshot_schedule = "0 6 21 * *"
# The first month partitioned: its window (from 2024-10-21) holds the changelog's first change,
# so the snapshots from here on hold the whole list's history.
first_snapshot = "2024-11"
# Changes per changelog request: about 6 MB of JSON. A month is about 160,000 changes.
changelog_page_size = 20000

[vmi_tax_arrears.http]
# Changelog reads, as vmi.daily_changes_http: one silent for 30 s has hung, and the portal stops
# answering changelog reads for a while after a burst, hence one a second.
timeout_seconds = 30
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 1

[vmi_taxes_paid]
# Taxes paid by legal entities (vmi/ja_mokesciai), read through its model's changelog: each
# monthly load inserts every company's year-to-date sum for the current year as a new row and
# deletes the previous load's.
model_url = "https://get.data.gov.lt/datasets/gov/vmi/ja_mokesciai/Moketojas"
# Loads land on no fixed day, one to three weeks after VMI's own date, sometimes two in a month.
# A snapshot holds the changes made in the month before its tick, so each month's leads see
# every load made by the 21st.
snapshot_schedule = "0 6 21 * *"
# The first month partitioned: its changes start on 2025-05-21. Until 2025-04-23 the changelog
# is 35 M patches pointing mm_kodas at JAR instead of the VMI register, too many to read, and
# the loads after it refer to JAR's entities.
first_snapshot = "2025-06"
# Changes per changelog request: a load's inserts are about 500 bytes of JSON each, so a page is
# about 10 MB, which raw reads with a 16 MB buffer, and a load about 13 requests.
changelog_page_size = 20000

[vmi_taxes_paid.http]
# Changelog pages of up to 20,000 changes, which the portal may take a while to start sending.
# The portal stops answering changelog reads for a while after a burst, hence one a second.
timeout_seconds = 60
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 1

[uzt_vacancies]
# The Employment Service's vacancies (laisvos darbo vietos): one row per vacancy since 1990.
vacancies_url = "https://get.data.gov.lt/datasets/gov/uzt/ldv/Vieta"
# Changed every night at about 02:00 UTC, but read monthly: a snapshot is the whole export (about
# 2.3 GB), and each holds every vacancy as it stands, history included. On the 21st with Sodra.
snapshot_schedule = "0 6 21 * *"
# The portal's cache may send a count or a page from before the newest change while it makes a
# new one: the fetch is asked for again from its count after this wait, up to export_attempts
# times in all.
export_attempts = 6
export_wait_seconds = 300
# The portal drops a response after about 25 minutes and sends at 0.6 to 1.6 MB/s: 400,000 rows
# are about 290 MB, three to eight minutes, so 3.2 M vacancies are nine pages.
page_rows = 400000
# The fetch's dagster/max_runtime: 2.3 GB at the slowest 0.6 MB/s seen take over an hour, and a
# stale count or page waits export_wait_seconds before the fetch is asked for again.
fetch_max_runtime_seconds = 7200

[uzt_vacancies.http]
# Pages fetched whole, as jar_financial_statements.http; each is streamed into the archive, and
# one that drops midway is asked for again from its beginning.
timeout_seconds = 300
attempts = 5
backoff_seconds = 1
max_wait_seconds = 300
min_interval_seconds = 1
