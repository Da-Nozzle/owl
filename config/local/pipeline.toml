# Dagster loads two code locations side by side: live calls the sources and archives what they
# return; replay reads replay_path and calls none. Each builds a lake of its own (lake.replay).
[pipeline]
# The timezone of every source's snapshot_schedule.
timezone = "Europe/Vilnius"
user_agent = "vmi-leads-pipeline/0.1"
replay_path = "/workspace/replay"

[google]
backend = "places_api"
api_key = { secret_store = "local", secret_name = "google_places_api_key" }

[sodra]
download_url_template = "https://atvira.sodra.lt/imones/downloads/{year}/monthly-{year}.csv.zip"
# When live fetches a snapshot (cron, pipeline.timezone). Sodra publishes the previous month by
# the 20th, so on the 21st at 06:00. A snapshot is keyed by the month of the tick it follows, so
# a fetch by hand before the 21st replaces the previous month's snapshot.
snapshot_schedule = "0 6 21 * *"
# Months loaded per snapshot, ending with the month before the snapshot's. Each snapshot reloads
# all of them, so Sodra's revisions land; 13 gives a year-on-year comparison.
history_months = 13

[jar]
# The register's datasets on get.data.gov.lt, each exported whole as one CSV; {dataset} is its
# path below rc/jar/, such as iregistruoti/JuridinisAsmuo.
download_url_template = "https://get.data.gov.lt/datasets/gov/rc/jar/{dataset}/:format/csv"
# When live fetches a snapshot (cron, pipeline.timezone). The portal lists the register as
# updated monthly, on no fixed day, and its changelog shows it less often: 2025-07-23,
# 2025-09-03, 2026-03-09, 2026-08-20. Monthly is the finest grain worth fetching, and since the
# day is free, it is the 21st at 06:00 with Sodra, so each month's leads see the newest register.
snapshot_schedule = "0 6 21 * *"

[address_register]
# The Address Register's datasets on get.data.gov.lt, each exported whole as one CSV; {dataset}
# is its path below rc/ar/, such as pastatas/Pastatas.
download_url_template = "https://get.data.gov.lt/datasets/gov/rc/ar/{dataset}/:format/csv"
# When live fetches a snapshot (cron, pipeline.timezone). The Registers Centre loads the register
# in the same batches as JAR, on no fixed day: its streets changed on 2025-05-16, 2025-09-03,
# 2026-03-09 and 2026-08-18. So, as JAR, monthly on the 21st at 06:00: each month's leads see the
# newest addresses, and a seat in JAR's snapshot of a month resolves in this one of the same month.
snapshot_schedule = "0 6 21 * *"

[vmi]
# The VMI taxpayer register on get.data.gov.lt (one row per company, branch, activity, taxpayer
# type and group, each with its validity), and the EVRK 2 classifier its activities refer to.
register_url = "https://get.data.gov.lt/datasets/gov/vmi/mm_registras/MokesciuMoketojas"
activities_url = "https://get.data.gov.lt/datasets/gov/lsd/cl/evrk/EkonominesVeiklosRusis"
# vmi_daily_changes: the register changes most days (15 days in September 2026), mostly in a
# burst at about 00:00 UTC. Its changelog keeps every change, so the changes are fetched daily, at
# 06:00, each snapshot holding those made in the day before its tick.
daily_changes_schedule = "0 6 * * *"
# The changelog reaches back to 2024-02-07; days from here on can be fetched, again or late.
first_daily_changes = "2026-09-01"
# vmi_monthly_register: the whole register (350 MB), fetched monthly as the baseline the daily
# changes made after it are applied to: often enough to keep that short, rarely enough to keep
# the archive small.
monthly_register_schedule = "0 6 21 * *"
