[project]
name = "owl-dagster-orchestration"
version = "0.1.0"
description = "Dagster definitions and the composition root for pipeline runs"
requires-python = ">=3.14,<3.15"
dependencies = [
    "owl-config",
    "owl-http",
    "owl-ingest",
    "owl-lake",
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    "dagster-postgres==0.29.26",
    "dagster-dbt==0.29.26",
    "duckdb==1.5.6",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "packaging>=26.3",
    "openlineage-python==1.54.0",
]

[project.scripts]
owl-dagster-dev = "owl_dagster_orchestration.dev_tools.dagster_dev:run_dagster_dev"
owl-dbt = "owl_dagster_orchestration.dev_tools.dbt_cli:run_dbt"
owl-dbt-dev = "owl_dagster_orchestration.dev_tools.dbt_cli:run_dbt_dev"
owl-dbt-diff = "owl_dagster_orchestration.dev_tools.dbt_cli:run_dbt_diff"
owl-dbt-vscode = "owl_dagster_orchestration.dev_tools.dbt_cli:write_vscode_settings"
owl-mcp-dbt = "owl_dagster_orchestration.dev_tools.mcp_servers:run_dbt_mcp"
owl-mcp-lake = "owl_dagster_orchestration.dev_tools.mcp_servers:run_lake_mcp"
owl-mcp-dagster = "owl_dagster_orchestration.dev_tools.mcp_servers:run_dagster_mcp"

[tool.uv.sources]
owl-config = { workspace = true }
owl-http = { workspace = true }
owl-ingest = { workspace = true }
owl-lake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owl_dagster_orchestration"]
