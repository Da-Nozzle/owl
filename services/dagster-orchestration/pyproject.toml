[project]
name = "leads-dagster-orchestration"
version = "0.1.0"
description = "Dagster definitions and the composition root for pipeline runs"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leads-config",
    "leads-http",
    "leads-ingest",
    "leads-lake",
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    "dagster-postgres==0.29.26",
    "dagster-dbt==0.29.26",
    "duckdb==1.5.6",
    "dbt-core>=1.12,<1.13",
    "dbt-duckdb>=1.11,<1.12",
    "packaging>=26.3",
    "openlineage-python==1.53.0",
]

[project.scripts]
leads-dagster-dev = "leads_dagster_orchestration.dev_tools.dagster_dev:run_dagster_dev"
leads-dbt = "leads_dagster_orchestration.dev_tools.dbt_cli:run_dbt"
leads-dbt-dev = "leads_dagster_orchestration.dev_tools.dbt_cli:run_dbt_dev"
leads-dbt-diff = "leads_dagster_orchestration.dev_tools.dbt_cli:run_dbt_diff"
leads-mcp-dbt = "leads_dagster_orchestration.dev_tools.mcp_servers:run_dbt_mcp"
leads-mcp-lake = "leads_dagster_orchestration.dev_tools.mcp_servers:run_lake_mcp"
leads-mcp-dagster = "leads_dagster_orchestration.dev_tools.mcp_servers:run_dagster_mcp"

[tool.uv.sources]
leads-config = { workspace = true }
leads-http = { workspace = true }
leads-ingest = { workspace = true }
leads-lake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leads_dagster_orchestration"]
