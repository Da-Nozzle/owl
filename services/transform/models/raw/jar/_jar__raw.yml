version: 2

sources:
  - name: archive
    tables:
      - name: jar
        description: >
          The Register of Legal Entities (JAR) on get.data.gov.lt, each dataset as the portal
          exports it whole: JuridinisAsmuo.csv (registered entities), Forma.csv (legal forms),
          Statusas.csv (legal statuses) and Buveine.csv (seats: each entity's registered office,
          as an address in the Address Register). Snapshots before 2026-10-17 have no Buveine.csv;
          2026-09 was fetched again with it. Comma-separated, double-quoted UTF-8 with no BOM; the
          header names Spinta's own columns first (_type, _id, _revision, _page.next), and a
          reference to another dataset as <property>._id. The portal lists the register as updated
          monthly; its changelog shows updates every one to six months, on no fixed day.

models:
  - name: raw_jar__entities
    description: >
      The register's entities as each snapshot fetched them: every row of JuridinisAsmuo.csv, under
      its published header, as text. One row per snapshot and entity; an export the register did
      not change since the last snapshot is there again, as that snapshot's fetch of it. Built from
      nothing, it reads every complete snapshot in the archive. The names of individual
      enterprises and of general and limited partnerships are anonymised by the register.
      pilnas_adresas and adresas._id are empty on every row: the registered address is the
      seat's (raw_jar__seats), resolved in the Address Register (archive address_register).
    columns: &file_columns
      - name: _source_file
        description: The archived file the row was read from.
      - name: _snapshot_month
        description: The snapshot (YYYY-MM) whose fetch this row is from, from the archive path.
      - name: _file_url
        description: Where the file was downloaded from.
      - name: _file_fetched_at
        description: When the file was downloaded (ISO 8601, UTC).
      - name: _file_last_modified
        description: >
          The export's Last-Modified header as the portal sent it (HTTP date): when the register
          last changed the dataset.
      - name: _file_sha256
        description: The downloaded file's SHA-256; equal for two fetches of the same version.

  - name: raw_jar__legal_forms
    description: >
      The register's legal form classifier (Forma.csv) as each snapshot fetched it, as text. One
      row per snapshot and legal form; entities refer to a form by its _id.
    columns: *file_columns

  - name: raw_jar__statuses
    description: >
      The register's legal status classifier (Statusas.csv) as each snapshot fetched it, as text.
      One row per snapshot and status; entities refer to a status by its _id.
    columns: *file_columns

  - name: raw_jar__seats
    description: >
      The register's seats (Buveine.csv) as each snapshot fetched them, as text. One row per
      snapshot and entity that has a seat: juridinis_asmuo._id is the entity's _id, adresas._id
      the seat's address in the Address Register (an address of a building, land plot or
      premises, raw_address_register.buildings or .premises by aob_kodas._id) and adresas_nuo
      when the entity registered it. The dataset last changed on 2025-09-03, so entities
      registered since have no seat, and a seat moved since is as it was then.
    columns: *file_columns
