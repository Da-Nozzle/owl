version: 2

sources:
  - name: archive
    description: >
      Raw source files as downloaded, at <archive>/<source>/<snapshot>/<file>, each with a
      .meta.json sidecar (URL, fetch time, Last-Modified, size, SHA-256). Read with read_csv, not
      as tables; declared so the graph shows which download each raw table is built from.
    tables:
      - name: sodra
        description: >
          Sodra's yearly employer files (atvira.sodra.lt), monthly-<year>.csv.zip, each a zip
          holding one UTF-8 CSV with a BOM, `;`-separated, values quoted. Sodra rewrites a year's
          file in place: the current year's grows by a month each time Sodra publishes, and a
          closed year's stops changing after its December is added.

models:
  - name: sodra_monthly_files
    description: >
      The yearly files the snapshot downloaded, whole, every column as published and as text,
      with the fetch each came from. Ephemeral, so the checks on it stop a bad file before raw is
      written.

  - name: raw_sodra__monthly
    description: >
      Every row of every yearly file each snapshot downloaded, under its published header, as
      text: one row per snapshot, file, employer and declared month, an unchanged file repeated as
      that snapshot's download. Built from nothing, it reads every complete snapshot in the
      archive. Sodra suppresses average wage and contributions for employers with 3 or fewer
      insured, and does not document the "II" pair (avgWage2, numInsured2).
    columns:
      - name: _source_file
        description: The archived file the row was read from, inside its zip.
      - name: _snapshot_month
        description: The snapshot (YYYY-MM) whose download this row is from, from the archive path.
      - name: _file_url
        description: Where the file was downloaded from.
      - name: _file_fetched_at
        description: When the file was downloaded (ISO 8601, UTC).
      - name: _file_last_modified
        description: >
          The file's Last-Modified header as Sodra sent it (HTTP date): when Sodra wrote this
          version of the file.
      - name: _file_sha256
        description: The downloaded file's SHA-256; equal for two downloads of the same version.
