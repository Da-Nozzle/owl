version: 2

sources:
  - name: archive
    tables:
      - name: vmi_daily_changes
        description: >
          The VMI taxpayer register's changelog on get.data.gov.lt
          (vmi/mm_registras/MokesciuMoketojas/:changes), one snapshot a day: the changes made in the
          day before the snapshot's 06:00 tick, as JSON pages ({"_data": [...]}) of up to 10,000
          changes, each page named after the first change id it may hold
          (changes-<id>.json). A change is an insert (every field), a patch (only the fields it
          set, a field emptied as null) or a delete, with its id (_cid), time (_created, UTC),
          register row (_id), transaction and revision. A day with no changes has no pages. The
          changelog keeps every past day, so a day can be fetched again with the same result.

models:
  - name: raw_vmi_daily_changes__changes
    description: >
      The register's changes as each daily snapshot fetched them: one row per change, its
      changelog fields as text and the change itself as JSON. Built from nothing, it reads every
      complete snapshot in the archive.
    columns:
      - name: _cid
        description: The change's id in the changelog; ids grow with time, with gaps.
      - name: _created
        description: When the change was made (ISO 8601, UTC, no offset).
      - name: _op
        description: insert, patch or delete.
      - name: _id
        description: The register row changed (the export's _id).
      - name: change
        description: The change as the portal sent it, JSON.
      - name: _source_file
        description: The archived page the change was read from.
      - name: _snapshot_day
        description: The snapshot (YYYY-MM-DD) whose fetch this change is from, from the archive path.
      - name: _file_url
        description: Where the page was downloaded from.
      - name: _file_fetched_at
        description: When the page was downloaded (ISO 8601, UTC).
      - name: _file_sha256
        description: The downloaded page's SHA-256.
