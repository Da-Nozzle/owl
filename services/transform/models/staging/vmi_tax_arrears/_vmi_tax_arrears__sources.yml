        - {company_code: 300000002, snapshot_month: "2025-02", record_number: "13", municipality_code: 13, arrears_amount: 7, overdue_amount: 7, deferred_amount: 0, months_listed: 1, previous_arrears_amount: null, arrears_change: 7, overdue_change: 7, arrears_row_id: b2}
        - {company_code: 300000003, snapshot_month: "2024-11", record_number: "22", municipality_code: 13, arrears_amount: 4, overdue_amount: 4, deferred_amount: 0, months_listed: 1, previous_arrears_amount: null, arrears_change: 4, overdue_change: 4, arrears_row_id: c2}
        - {company_code: 300000003, snapshot_month: "2024-12", record_number: "22", municipality_code: 13, arrears_amount: 4, overdue_amount: 4, deferred_amount: 0, months_listed: 2, previous_arrears_amount: 4, arrears_change: 0, overdue_change: 0, arrears_row_id: c2}
        - {company_code: 300000003, snapshot_month: "2025-02", record_number: "23", municipality_code: 13, arrears_amount: 6, overdue_amount: 6, deferred_amount: 0, months_listed: 4, previous_arrears_amount: 4, arrears_change: 2, overdue_change: 2, arrears_row_id: c3}
