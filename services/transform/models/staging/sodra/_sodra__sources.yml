version: 2

models:
  - name: stg_sodra__monthly
    description: >
      One row per employer and declared month, from the newest download of the year's file that
      holds it: Sodra's published headers mapped to names and types. Every month the downloads
      cover, with no window applied. Average wage and contributions are suppressed for employers
      with 3 or fewer insured.
    data_tests:
      - unique:
          column_name: "insurer_code || '-' || declared_month"
    columns:
      - name: insurer_code
        data_tests:
          - not_null
      - name: company_code
        description: JAR code; empty for employers outside the register, such as embassies.
      - name: declared_month
        data_tests:
          - not_null
      - name: activity_code
        description: >
          Six-digit EVRK 2.1 code, or a coarser 2- or 4-digit level. Sodra publishes it as a
          number, so a lost leading zero is restored.
      - name: insured_count
        data_tests:
          - not_null
      - name: snapshot_month
        description: The run month (YYYY-MM) whose download this row's version is from.
      - name: file_published_at
        description: >
          When Sodra wrote that version of the year's file (its Last-Modified, UTC): what the
          row is as of.

unit_tests:
  - name: stg_sodra__monthly_takes_each_years_file_from_its_newest_download
    description: >
      The 2026 file is in both runs' downloads, so 2026-09's version wins, and employer 2, which
      Sodra dropped from 202607 in that version, is gone. The 2025 file is only in 2026-08's
      downloads (a later run's window no longer reaches 2025), so it stays as 2026-08 loaded it.
      Downloads arrive out of order, as after a rerun of 2026-08.
    model: stg_sodra__monthly
    given:
      - input: ref('raw_sodra__monthly')
        rows:
          - {"_snapshot_month": "2026-09", "_source_file": "zip://a/sodra/2026-09/monthly-2026.csv.zip/monthly-2026.csv", "_file_last_modified": "Tue, 29 Sep 2026 11:23:05 GMT", "Mėnuo (month)": "202607", "Draudėjo kodas (code)": "1", "Apdraustųjų skaičius (numInsured)": "6"}
          - {"_snapshot_month": "2026-09", "_source_file": "zip://a/sodra/2026-09/monthly-2026.csv.zip/monthly-2026.csv", "_file_last_modified": "Tue, 29 Sep 2026 11:23:05 GMT", "Mėnuo (month)": "202608", "Draudėjo kodas (code)": "1", "Apdraustųjų skaičius (numInsured)": "7"}
          - {"_snapshot_month": "2026-08", "_source_file": "zip://a/sodra/2026-08/monthly-2025.csv.zip/monthly-2025.csv", "_file_last_modified": "Tue, 27 Jan 2026 11:22:59 GMT", "Mėnuo (month)": "202506", "Draudėjo kodas (code)": "1", "Apdraustųjų skaičius (numInsured)": "3"}
          - {"_snapshot_month": "2026-08", "_source_file": "zip://a/sodra/2026-08/monthly-2026.csv.zip/monthly-2026.csv", "_file_last_modified": "Fri, 28 Aug 2026 10:00:00 GMT", "Mėnuo (month)": "202607", "Draudėjo kodas (code)": "1", "Apdraustųjų skaičius (numInsured)": "5"}
          - {"_snapshot_month": "2026-08", "_source_file": "zip://a/sodra/2026-08/monthly-2026.csv.zip/monthly-2026.csv", "_file_last_modified": "Fri, 28 Aug 2026 10:00:00 GMT", "Mėnuo (month)": "202607", "Draudėjo kodas (code)": "2", "Apdraustųjų skaičius (numInsured)": "4"}
    expect:
      rows:
        - {insurer_code: 1, declared_month: "2025-06-01", insured_count: 3, snapshot_month: "2026-08", file_published_at: "2026-01-27 11:22:59"}
        - {insurer_code: 1, declared_month: "2026-07-01", insured_count: 6, snapshot_month: "2026-09", file_published_at: "2026-09-29 11:23:05"}
        - {insurer_code: 1, declared_month: "2026-08-01", insured_count: 7, snapshot_month: "2026-09", file_published_at: "2026-09-29 11:23:05"}
