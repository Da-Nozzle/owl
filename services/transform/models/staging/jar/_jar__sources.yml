version: 2

models:
  - name: stg_jar__entities
    description: >
      One row per registered legal entity and snapshot, with its legal form and status resolved
      in that snapshot's classifiers; deregistered entities are kept. The register anonymises
      individual enterprises and general and limited partnerships (legal forms 810, 210, 220 and
      their branches 811, 211, 221): each is named after its form. The registered address is the
      seat's, an address_id in stg_address_register__addresses; seats last changed on 2025-09-03,
      so entities registered since have none.
    config:
      meta:
        # owl-dbt-diff matches rows on it.
        key: [company_code, snapshot_month]
    data_tests:
      - unique:
          column_name: "company_code || '-' || snapshot_month"
    columns:
      - name: company_code
        description: JAR code (ja_kodas); Sodra's jarCode.
        data_tests:
          - not_null
      - name: company_name
        description: The registered name, as published.
        data_tests:
          - not_null
      - name: legal_form_code
        description: The legal form's code in the register's classifier (310 is a private limited company, UAB).
        data_tests:
          # Also fails when the entity's form is not in its snapshot's classifier.
          - not_null
      - name: legal_form
        description: The legal form's name, in Lithuanian.
      - name: status_code
        description: The legal status's code in the register's classifier (0 is no proceedings, 10 deregistered).
        data_tests:
          # Also fails when the entity's status is not in its snapshot's classifier.
          - not_null
      - name: status
        description: The legal status's name, in Lithuanian.
      - name: registered_on
        data_tests:
          - not_null
      - name: deregistered_on
        description: Empty while the entity is registered.
        data_tests:
          # Every deregistered entity (status 10) has the date, so a renamed column fails here.
          - not_null:
              config:
                where: "status_code = 10"
      - name: status_since
        description: When the entity took its current legal status.
        data_tests:
          - not_null
      - name: registered_address_id
        description: >
          The seat's (registered office's) address: an address_id in
          stg_address_register__addresses, of a building, land plot or premises. Empty for an
          entity with no seat in its snapshot (registered after 2025-09-03, when the register's
          seats last changed) or a seat with no address.
      - name: registered_address_since
        description: When the entity registered its seat at that address.
      - name: snapshot_month
        description: The snapshot (YYYY-MM) whose fetch this row is from.
        data_tests:
          - not_null
      - name: file_published_at
        description: >
          When the register last changed the entities dataset before this snapshot fetched it (its
          Last-Modified, UTC): what the row is as of.

unit_tests:
  - name: stg_jar__entities_resolves_references_in_the_entitys_own_snapshot
    description: >
      Both snapshots fetched the same classifiers and seats, so a reference resolved in every
      snapshot's would match each entity twice. The company is deregistered and moves its seat
      between the two snapshots, so each snapshot keeps the status and seat it had then.
    model: stg_jar__entities
    given:
      - input: ref('raw_jar__entities')
        rows:
          - {"_snapshot_month": "2026-08", "_file_last_modified": "Fri, 21 Aug 2026 06:07:56 GMT", "_id": "e1", "ja_kodas": "110607882", "ja_pavadinimas": "UAB \"Kavos pupa\"", "reg_data": "1997-05-21", "isreg_data": null, "forma._id": "f310", "statusas._id": "s0", "stat_data": "1997-05-21"}
          - {"_snapshot_month": "2026-09", "_file_last_modified": "Mon, 21 Sep 2026 06:00:00 GMT", "_id": "e1", "ja_kodas": "110607882", "ja_pavadinimas": "UAB \"Kavos pupa\"", "reg_data": "1997-05-21", "isreg_data": "2026-09-01", "forma._id": "f310", "statusas._id": "s10", "stat_data": "2026-09-01"}
      - input: ref('raw_jar__legal_forms')
        rows:
          - {"_snapshot_month": "2026-08", "_id": "f310", "kodas": "310", "pavadinimas": "Uždaroji akcinė bendrovė"}
          - {"_snapshot_month": "2026-09", "_id": "f310", "kodas": "310", "pavadinimas": "Uždaroji akcinė bendrovė"}
      - input: ref('raw_jar__statuses')
        rows:
          - {"_snapshot_month": "2026-08", "_id": "s0", "kodas": "0", "pavadinimas": "Teisinis statusas neįregistruotas"}
          - {"_snapshot_month": "2026-08", "_id": "s10", "kodas": "10", "pavadinimas": "Išregistruotas"}
          - {"_snapshot_month": "2026-09", "_id": "s0", "kodas": "0", "pavadinimas": "Teisinis statusas neįregistruotas"}
          - {"_snapshot_month": "2026-09", "_id": "s10", "kodas": "10", "pavadinimas": "Išregistruotas"}
      - input: ref('raw_jar__seats')
        rows:
          - {"_snapshot_month": "2026-08", "juridinis_asmuo._id": "e1", "adresas._id": "a1", "adresas_nuo": "1997-05-21"}
          - {"_snapshot_month": "2026-09", "juridinis_asmuo._id": "e1", "adresas._id": "a2", "adresas_nuo": "2026-08-03"}
    expect:
      rows:
        - {company_code: 110607882, company_name: "UAB \"Kavos pupa\"", legal_form_code: 310, status_code: 0, deregistered_on: null, registered_address_id: a1, registered_address_since: "1997-05-21", snapshot_month: "2026-08", file_published_at: "2026-08-21 06:07:56"}
        - {company_code: 110607882, company_name: "UAB \"Kavos pupa\"", legal_form_code: 310, status_code: 10, deregistered_on: "2026-09-01", registered_address_id: a2, registered_address_since: "2026-08-03", snapshot_month: "2026-09", file_published_at: "2026-09-21 06:00:00"}
