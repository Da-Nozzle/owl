version: 2

seeds:
  - name: municipalities
    description: >
      Lithuania's 60 municipalities: the Address Register's code and name (rc/ar Savivaldybe, as
      fetched on 2026-10-17), the name as Sodra writes it (miesto as m., rajono as r.), and the
      bounding box of the municipality's boundary in OpenStreetMap (Nominatim, 2026-10-17, the
      relation in osm_id), rounded outwards to four decimals. Boundaries change rarely; look them
      up again if one does.
    columns:
      - name: municipality_code
        description: The Address Register's code (sav_kodas); VMI's municipality codes are the same.
        data_tests:
          - unique
          - not_null
      - name: sodra_municipality
        description: The name as Sodra's files write it (Vilniaus m. sav.).
        data_tests:
          - unique
          - not_null
      - name: south
        data_tests: [not_null]
      - name: west
        data_tests: [not_null]
      - name: north
        data_tests: [not_null]
      - name: east
        data_tests: [not_null]

  - name: activity_categories
    description: >
      The leads' categories by economic activity code prefix (four digits), in each EVRK version
      the sources code in: Sodra in EVRK 2.1 since 2025 (a few rows still in EVRK 2), the VMI
      register in EVRK 2. EVRK 2.1 split restaurants (56.10 into 56.11 and 56.12) and hair and
      beauty (96.02 into 96.21 and 96.22), and moved car repair from 45.20 to 95.31.
    data_tests:
      - unique:
          column_name: "classification || ' ' || code_prefix"
    columns:
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [cafes_restaurants, hair_beauty, car_repair]
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: [EVRK 2, EVRK 2.1]

  - name: google_search_scope
    description: >
      Where Google is searched: one row per municipality to search, `price` to have
      plan_google_places plan it for free and show what fetching it would pay for, `fetch` to have
      the monthly fetch pay for it too. A municipality not listed is not searched. Every change is
      priced again before anything is paid for it.
    columns:
      - name: municipality_code
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('municipalities')
                field: municipality_code
      - name: search_mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [price, fetch]

  - name: profession_categories
    description: >
      The leads' categories by profession, for the Employment Service's vacancies: the
      occupations whose ads say most about a café, restaurant, hair or beauty salon or car
      repair shop, each as a prefix of the vacancy's six-digit profession code (Lietuvos
      profesijų klasifikatorius, built on ISCO-08: four digits are an ISCO unit group, the last
      two the Lithuanian profession within it). A whole unit group where all of it is the
      occupation (5120 cooks, 5131 waiters, 5141 hairdressers, 7231 motor vehicle mechanics),
      single professions where the group mixes others in (513202 barista beside 513201
      bartender; 5142's beauticians, manicurists and make-up artists but not its masseurs, sauna
      or solarium attendants). Professions outside it are no category.
    data_tests:
      - unique:
          column_name: profession_code_prefix
    columns:
      - name: category
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('activity_categories')
                field: category
      - name: occupation
        description: The occupation the prefix is, in English (cook, waiter, car_mechanic, ...).
        data_tests:
          - not_null
      - name: profession_code_prefix
        description: >
          The first four or six digits of a profession code; no prefix starts another
          (profession_categories_do_not_overlap), so a profession has one category at most.
        data_tests:
          - not_null

  - name: financial_statement_measures
    description: >
      The canonical measure of each line JAR's financial statements publish
      (stg_jar_financial_statements__lines), by its line_type_id, which names one line in every
      form that has it: sales revenue (PARDAVIMO PAJAMOS) is ISLT00345 in the short and the small
      companies' and partnerships' income statements (IST023, IST024, IST118, IST303) and
      ISLT00001 in the others. A non-profit's results (VEIKLOS REZULTATAS) are its profit, but
      its income (PAJAMOS, grants included) is total_income, not revenue: since 2024 its forms
      (FS05xx, FS06xx) publish its sales revenue too, a part of it. The register publishes only
      these 24 lines (2026-10-18). A line the register adds warns in staging until it is mapped
      here.
    columns:
      - name: line_type_id
        data_tests:
          - unique
          - not_null
      - name: line_name
        description: As the register names the line, for reading.
      - name: measure
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - revenue
                  - total_income
                  - profit_before_tax
                  - net_profit
                  - non_current_assets
                  - tangible_non_current_assets
                  - current_assets
                  - total_assets
                  - equity
                  - liabilities

  - name: minimum_wages
    description: >
      Lithuania's minimum monthly wage (minimalioji mėnesinė alga, MMA), gross, as the
      Government sets it for each calendar year under the Labour Code's article 141: one row per
      change, in force from valid_from until the next row. 2022 to 2025 as the Visuotinė
      lietuvių enciklopedija lists them (https://www.vle.lt/Straipsnis/alga, read 2026-10-19:
      730, 840, 924 and 1,038 EUR); 2026 from the Government's resolution "Dėl 2026 metais
      taikomo minimaliojo darbo užmokesčio", 1,153 EUR and 7.05 EUR an hour (the draft
      TAP-25-1227 of 2025-10-15, https://lrv.lt/media/viesa/saugykla/2025/10/EKYvBrfYSz0.pdf;
      news reports say it was adopted unchanged; the adopted act in e-TAR was not checked). Add
      each new year's when the Government adopts it, usually in the autumn before: a month past
      the last row keeps the last row's wage.
    columns:
      - name: valid_from
        data_tests:
          - unique
          - not_null
      - name: monthly_eur
        description: The gross minimum monthly wage, in euros, for full-time work.
        data_tests:
          - not_null

  - name: risk_models
    description: >
      The registry of risk models: one row per risk model and version, each a stated hypothesis
      of undeclared work or income, with the legitimate explanations that would produce the same
      numbers. An enabled row is built as models/risk/<id>/ (rm_<id>, that version) and joins
      fct_score_components, which reads the enabled rows through OWL_RISK_MODELS (README, Adding
      a risk model); the test risk_models_match_registry fails when enabled rows and rm_* models
      differ. Which version is scored is the model's latest_version in its YAML.
    data_tests:
      - unique:
          column_name: "id || '@' || version"
    columns:
      - name: id
        description: The model's name without rm_ (wage_floor is rm_wage_floor), and its folder.
        data_tests:
          - not_null
      - name: version
        description: The rm_<id> version this row describes (dbt's model version, v).
        data_tests:
          - not_null
      - name: family
        description: >
          What kind of evidence it is: staffing (busy against headcount), wages, revenue_tax
          (declared revenue and taxes against activity), compliance (arrears, filings),
          financial_health (persistent losses, negative equity), history (phoenix patterns).
          Tier A needs fired models of two families, so two models of one kind never make a lead.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [staffing, wages, revenue_tax, compliance, financial_health, history]
      - name: weight
        description: >
          The model's weight in the score, a weighted mean of percentiles; 1.0 is the default.
          Positive (risk_models_match_registry).
        data_tests:
          - not_null
      - name: hypothesis
        description: What the model suspects, in a sentence a non-accountant can review.
        data_tests:
          - not_null
      - name: legitimate_explanations
        description: The innocent reasons for the same numbers, which an analyst rules out first.
        data_tests:
          - not_null
      - name: sources
        description: The models and seeds it reads.
      - name: enabled
        description: Whether the version is built and scored; a disabled row is kept as the record.
        data_tests:
          - not_null
