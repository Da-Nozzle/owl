name: leads_transform
version: "0.1.0"
config-version: 2
profile: leads

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  leads_transform:
    raw:
      sodra:
        +schema: raw_sodra
      jar:
        +schema: raw_jar
      address_register:
        +schema: raw_address_register
      vmi_daily_changes:
        +schema: raw_vmi_daily_changes
      vmi_monthly_register:
        +schema: raw_vmi_monthly_register
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
