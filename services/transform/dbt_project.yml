name: owl_transform
version: "0.1.0"
config-version: 2
profile: owl

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  owl_transform:
    raw:
      sodra:
        +schema: raw_sodra
      jar:
        +schema: raw_jar
      jar_financial_statements:
        +schema: raw_jar_financial_statements
      address_register:
        +schema: raw_address_register
      vmi_daily_changes:
        +schema: raw_vmi_daily_changes
      vmi_monthly_register:
        +schema: raw_vmi_monthly_register
      vmi_tax_arrears:
        +schema: raw_vmi_tax_arrears
      vmi_taxes_paid:
        +schema: raw_vmi_taxes_paid
      google_places:
        +schema: raw_google_places
      uzt_vacancies:
        +schema: raw_uzt_vacancies
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts

seeds:
  owl_transform:
    +schema: seeds
    municipalities:
      +column_types:
        municipality_code: integer
        south: double
        west: double
        north: double
        east: double
    activity_categories:
      +column_types:
        code_prefix: varchar
    google_search_scope:
      +column_types:
        municipality_code: integer
        search_mode: varchar
    profession_categories:
      +column_types:
        profession_code_prefix: varchar
    financial_statement_measures:
      +column_types:
        line_type_id: varchar
        line_name: varchar
        measure: varchar
