[project]
name = "leads-ingest"
version = "0.1.0"
description = "Source fetches, the raw archive they write to, and the adapters they reach sources and the lake through"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leads-config",
    "leads-lake",
    "duckdb==1.5.6",
    "fsspec>=2026.9",
    "httpx>=0.28.1,<1",
    "s3fs>=2026.9",
    "tenacity>=9.2,<10",
]

[tool.uv.sources]
leads-config = { workspace = true }
leads-lake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leads_ingest"]
