[project]
name = "leads-ingest"
version = "0.1.0"
description = "dlt sources and the DuckLake destination they load into"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leads-lake",
    "dlt[ducklake,postgres,s3]>=1.31,<2",
    "duckdb==1.5.6",
]

[tool.uv.sources]
leads-lake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leads_ingest"]
