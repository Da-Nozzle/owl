[project]
name = "leads-ingest"
version = "0.1.0"
description = "dlt sources, the raw archive they read from, and the DuckLake destination"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leads-config",
    "leads-lake",
    "dlt[ducklake,postgres,s3]>=1.31,<2",
    "duckdb==1.5.6",
    "fsspec>=2026.9",
    "pyarrow>=26",
]

[tool.uv.sources]
leads-config = { workspace = true }
leads-lake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leads_ingest"]
