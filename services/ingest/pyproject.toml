[project]
name = "owl-ingest"
version = "0.1.1"
description = "Source fetches, the raw archive they write to, and the adapters they reach sources and the lake through"
requires-python = ">=3.14,<3.15"
dependencies = [
    "owl-config",
    "owl-http",
    "owl-lake",
    "duckdb==1.5.6",
    "fsspec>=2026.9",
    "httpx>=0.28.1,<1",
    "s3fs>=2026.9",
]

[tool.uv.sources]
owl-config = { workspace = true }
owl-http = { workspace = true }
owl-lake = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owl_ingest"]
