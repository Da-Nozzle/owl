[project]
name = "owl-testing"
version = "0.1.0"
description = "Builders and fakes that the other packages' tests share; a dev dependency only"
requires-python = ">=3.14,<3.15"
dependencies = ["owl-config", "owl-ingest"]

[tool.uv.sources]
owl-config = { workspace = true }
owl-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owl_testing"]
