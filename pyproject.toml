[project]
name = "poc-data-pipeline-excercise"
version = "0.1.0"
description = "Homework"
requires-python = ">=3.14,<3.15"
dependencies = [
    "leads-config",
    "leads-dagster-orchestration",
    "leads-http",
    "leads-ingest",
    "leads-lake",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "leads-testing",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]
exclude = ["services/transform"]

[tool.uv.sources]
leads-config = { workspace = true }
leads-dagster-orchestration = { workspace = true }
leads-http = { workspace = true }
leads-ingest = { workspace = true }
leads-lake = { workspace = true }
leads-testing = { workspace = true }

[[tool.uv.dependency-metadata]]
name = "dagster-dbt"
version = "0.29.26"
requires-python = ">=3.10,<3.15"
requires-dist = [
    "dagster==1.13.26",
    "gitpython",
    "jinja2",
    "networkx",
    "orjson",
    "packaging",
    "requests",
    "rich",
    "sqlglot[rs]",
    "typer>=0.9.0",
    "dbt-core>=1.7,<1.13; extra == 'dbt-core'",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "RET",
    "PTH",
    "ERA",
    "PT",
    "TID",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["leads_*"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic".msg = "No runtime type validation. Use frozen dataclasses."
"os.environ".msg = "Read config from TOML."
"os.getenv".msg = "Read config from TOML."

[tool.ruff.lint.per-file-ignores]
"services/dagster-orchestration/src/leads_dagster_orchestration/dev_tools/launch.py" = [
    "TID251",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["services", "libs"]
# Set by conftest.py from the directory a test is in.
markers = [
    "unit: in-process only (tests/unit/)",
    "integration: uses the filesystem, a database, an HTTP server or Dagster's executor (tests/integration/)",
]
filterwarnings = [
    # dagster-dbt depends on sqlglot[rs]; nothing here parses SQL with it.
    "ignore:sqlglotrs is deprecated:DeprecationWarning",
]
