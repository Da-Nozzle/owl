[project]
name = "owl"
version = "0.1.0"
description = "Off-books Work Locator: ranks businesses that look busy but declare little to Sodra"
requires-python = ">=3.14,<3.15"
dependencies = [
    "owl-config",
    "owl-dagster-orchestration",
    "owl-http",
    "owl-ingest",
    "owl-lake",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "owl-testing",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.1",
]
# The release job's only (.github/workflows/release.yml). Not installed in the dev container.
release = ["python-semantic-release>=10.7.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]
exclude = ["services/transform"]

[tool.uv.sources]
owl-config = { workspace = true }
owl-dagster-orchestration = { workspace = true }
owl-http = { workspace = true }
owl-ingest = { workspace = true }
owl-lake = { workspace = true }
owl-testing = { workspace = true }

[[tool.uv.dependency-metadata]]
name = "dagster-dbt"
version = "0.29.26"
requires-python = ">=3.10,<3.15"
requires-dist = [
    "dagster==1.13.26",
    "gitpython",
    "jinja2",
    "networkx",
    "orjson",
    "packaging",
    "requests",
    "rich",
    "sqlglot[rs]",
    "typer>=0.9.0",
    "dbt-core>=1.7,<1.13; extra == 'dbt-core'",
]

[tool.semantic_release]
# One version for the whole repo, set by the release job on main from the commits since the last
# tag (.github/workflows/release.yml): fix and perf bump the patch, feat the minor. Until 1.0.0 a
# breaking change bumps the minor too. Commits without a type make no release and are left out
# of the changelog.
version_toml = [
    "pyproject.toml:project.version",
    "services/config/pyproject.toml:project.version",
    "services/dagster-orchestration/pyproject.toml:project.version",
    "services/ingest/pyproject.toml:project.version",
    "libs/http/pyproject.toml:project.version",
    "libs/lake/pyproject.toml:project.version",
    "libs/testing/pyproject.toml:project.version",
]
version_variables = ["services/transform/dbt_project.yml:version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version}"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
build_command = "uv lock && git add uv.lock"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "test",
]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['^chore\(release\): ']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
# Nothing is built for a release: its tag, changelog and GitHub release are all there is.
upload_to_vcs_release = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "RET",
    "PTH",
    "ERA",
    "PT",
    "TID",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["owl_*"]
# Personal preferences bellow
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic".msg = "No runtime type validation. Use frozen dataclasses."
"os.environ".msg = "Read config from TOML."
"os.getenv".msg = "Read config from TOML."

[tool.ruff.lint.per-file-ignores]
"services/dagster-orchestration/src/owl_dagster_orchestration/dev_tools/launch.py" = [
    "TID251",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["services", "libs"]
# Set by conftest.py from the directory a test is in.
markers = [
    "unit: in-process only (tests/unit/)",
    "integration: uses the filesystem, a database, an HTTP server or Dagster's executor (tests/integration/)",
]
filterwarnings = [
    # dagster-dbt depends on sqlglot[rs], nothing here parses SQL with it.
    "ignore:sqlglotrs is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# Relative, as CI reads the data outside the dev container, where /workspace is another folder.
relative_files = true
source = ["services", "libs"]
omit = ["*/tests/*", "libs/testing/*"]

[tool.coverage.report]
skip_covered = true
skip_empty = true
