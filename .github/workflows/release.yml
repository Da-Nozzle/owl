name: Release

# Once CI passes on main: the next version from the commits since the last tag, written into every
# pyproject.toml, uv.lock and CHANGELOG.md, committed to main, tagged and released on GitHub.
# Settings: [tool.semantic_release] in pyproject.toml.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            dry-run:
                description: Print the next version and changelog without committing, tagging or releasing
                type: boolean
                default: true

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # every tag and commit since the last release
            # The commit CI passed, not one pushed since: the release commit then fails to push, and
            # the newer commit's own run releases both.
            - name: Check out the commit CI passed
              if: github.event_name == 'workflow_run'
              env:
                  SHA: ${{ github.event.workflow_run.head_sha }}
              run: git reset --hard "$SHA"
            # The dev image's uv: the uv stage of its Dockerfile.
            - name: uv
              run: |
                  docker build --target uv --output "type=local,dest=$RUNNER_TEMP/uv" .devcontainer
                  echo "$RUNNER_TEMP/uv" >> "$GITHUB_PATH"
            - name: Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DRY_RUN: ${{ inputs.dry-run }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if [ "$DRY_RUN" = true ]; then set -- --noop; fi
                  uv run --frozen --only-group release semantic-release -v "$@" version
